name: Build Fabric Mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: mc1_20_1
            minecraft: 1.20.1
          - module: mc1_20_2
            minecraft: 1.20.2
          - module: mc1_20_3
            minecraft: 1.20.3
          - module: mc1_20_4
            minecraft: 1.20.4
          - module: mc1_20_5
            minecraft: 1.20.5
          - module: mc1_20_6
            minecraft: 1.20.6
          - module: mc1_21
            minecraft: 1.21
          - module: mc1_21_1
            minecraft: 1.21.1
          - module: mc1_21_2
            minecraft: 1.21.2
          - module: mc1_21_3
            minecraft: 1.21.3
          - module: mc1_21_4
            minecraft: 1.21.4
          - module: mc1_21_5
            minecraft: 1.21.5
          - module: mc1_21_6
            minecraft: 1.21.6
          - module: mc1_21_7
            minecraft: 1.21.7
          - module: mc1_21_8
            minecraft: 1.21.8
          - module: mc1_21_9
            minecraft: 1.21.9
          - module: mc1_21_10
            minecraft: 1.21.10
          - module: mc1_21_11
            minecraft: 1.21.11

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build version jar
        id: build_version
        continue-on-error: true
        run: ./gradlew :${{ matrix.module }}:clean :${{ matrix.module }}:build --configure-on-demand --console=plain --no-daemon

      - name: Write version build status
        if: always()
        shell: bash
        run: |
          mkdir -p build/version-results
          if [[ "${{ steps.build_version.outcome }}" == "success" ]]; then
            status="SUCCESS"
            artifact="taskmanager-fabric-${{ matrix.minecraft }}"
          else
            status="FAILED"
            artifact="-"
          fi
          printf '%s | %s | %s | %s\n' "$status" "${{ matrix.minecraft }}" "${{ matrix.module }}" "$artifact" > "build/version-results/${{ matrix.module }}.txt"

      - name: Upload version jar
        if: steps.build_version.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: taskmanager-fabric-${{ matrix.minecraft }}
          path: |
            versions/${{ matrix.minecraft }}/build/libs/*.jar
            !versions/${{ matrix.minecraft }}/build/libs/*-sources.jar
            !versions/${{ matrix.minecraft }}/build/libs/*-dev.jar
          if-no-files-found: error

      - name: Upload version status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskmanager-build-result-${{ matrix.module }}
          path: build/version-results/${{ matrix.module }}.txt
          if-no-files-found: error

      - name: Mark matrix build as failed
        if: steps.build_version.outcome == 'failure'
        run: exit 1

  build-report:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Download version status artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: taskmanager-build-result-*
          path: build/version-results
          merge-multiple: true

      - name: Create consolidated build report
        shell: bash
        run: |
          mkdir -p build
          report_path="build/version-build-report.txt"
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "TaskManager GitHub Actions version build report"
            echo "Generated: ${generated_at}"
            echo "Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Status | Minecraft | Module | Artifact"
            echo "------ | --------- | ------ | --------"
            find build/version-results -type f -name '*.txt' -print0 | sort -z | xargs -0 cat
          } > "${report_path}"

          success_count="$(grep -c '^SUCCESS |' "${report_path}" || true)"
          failure_count="$(grep -c '^FAILED |' "${report_path}" || true)"

          {
            echo "## Version Build Report"
            echo
            echo "Succeeded: ${success_count}"
            echo "Failed: ${failure_count}"
            echo
            cat "${report_path}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload consolidated build report
        uses: actions/upload-artifact@v4
        with:
          name: taskmanager-build-report
          path: build/version-build-report.txt
          if-no-files-found: error