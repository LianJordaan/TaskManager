plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

ext.versionMatrix = [
    mc1_20_1 : [minecraft: '1.20.1', fabricApi: '0.92.9+1.20.1'],
    mc1_20_2 : [minecraft: '1.20.2', fabricApi: '0.91.6+1.20.2'],
    mc1_20_3 : [minecraft: '1.20.3', fabricApi: '0.91.1+1.20.3'],
    mc1_20_4 : [minecraft: '1.20.4', fabricApi: '0.97.3+1.20.4'],
    mc1_20_5 : [minecraft: '1.20.5', fabricApi: '0.97.8+1.20.5'],
    mc1_20_6 : [minecraft: '1.20.6', fabricApi: '0.100.8+1.20.6'],
    mc1_21   : [minecraft: '1.21', fabricApi: '0.102.0+1.21'],
    mc1_21_1 : [minecraft: '1.21.1', fabricApi: '0.116.12+1.21.1'],
    mc1_21_2 : [minecraft: '1.21.2', fabricApi: '0.106.1+1.21.2'],
    mc1_21_3 : [minecraft: '1.21.3', fabricApi: '0.114.1+1.21.3'],
    mc1_21_4 : [minecraft: '1.21.4', fabricApi: '0.119.4+1.21.4'],
    mc1_21_5 : [minecraft: '1.21.5', fabricApi: '0.128.2+1.21.5'],
    mc1_21_6 : [minecraft: '1.21.6', fabricApi: '0.128.2+1.21.6'],
    mc1_21_7 : [minecraft: '1.21.7', fabricApi: '0.129.0+1.21.7'],
    mc1_21_8 : [minecraft: '1.21.8', fabricApi: '0.136.1+1.21.8'],
    mc1_21_9 : [minecraft: '1.21.9', fabricApi: '0.134.1+1.21.9'],
    mc1_21_10: [minecraft: '1.21.10', fabricApi: '0.138.4+1.21.10'],
    mc1_21_11: [minecraft: '1.21.11', fabricApi: '0.141.4+1.21.11'],
    mc26_1   : [minecraft: '26.1', fabricApi: '0.155.3+26.1.2', loader: '0.19.5', java: 25],
    mc26_1_1 : [minecraft: '26.1.1', fabricApi: '0.155.3+26.1.2', loader: '0.19.5', java: 25],
    mc26_1_2 : [minecraft: '26.1.2', fabricApi: '0.155.3+26.1.2', loader: '0.19.5', java: 25],
    mc26_2   : [minecraft: '26.2', fabricApi: '0.161.0+26.2', loader: '0.19.5', java: 25],
    mc26_3   : [minecraft: '26.3', fabricApi: '0.161.0+26.3', loader: '0.19.5', java: 25]
]

configure(subprojects.findAll { rootProject.versionMatrix.containsKey(it.name) }) {
    apply plugin: 'java'
    def mc = rootProject.versionMatrix[project.name]
    def nonObfuscated = mc.minecraft.startsWith('26.')
    apply plugin: nonObfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
    apply plugin: 'maven-publish'

    def modernUiVersions = ['1.21.9', '1.21.10', '1.21.11', '26.3'] as Set
    def matrixLegacyRenderVersions = ['1.21.6', '1.21.7', '1.21.8'] as Set
    def modBuildVersion = "${rootProject.mod_version}+mc${mc.minecraft}"

    version = rootProject.mod_version
    group = rootProject.maven_group

    base {
        archivesName = "${rootProject.archives_base_name}-${mc.minecraft}"
    }

    repositories {
        mavenCentral()
    }

    sourceSets {
        main {
            def compatJavaDirs = [rootProject.file('src/main/java')]

            compatJavaDirs += rootProject.file(nonObfuscated
                ? 'src/compat_26/java'
                : 'src/compat_graphics_legacy/java')
            if (nonObfuscated) {
                compatJavaDirs += rootProject.file(mc.minecraft == '26.3'
                    ? 'src/compat_26_3/java'
                    : mc.minecraft == '26.2'
                        ? 'src/compat_26_2/java'
                        : 'src/compat_26_pre3/java')
            }

            if (nonObfuscated) {
                // Newer Minecraft releases use the extraction-based GUI API.
            } else if (mc.minecraft == '1.20.1') {
                compatJavaDirs += rootProject.file('src/compat_1_20/java')
            } else if (modernUiVersions.contains(mc.minecraft)) {
                compatJavaDirs += rootProject.file('src/compat_1_21/java')
            } else {
                compatJavaDirs += rootProject.file('src/compat_legacy_common/java')
                compatJavaDirs += matrixLegacyRenderVersions.contains(mc.minecraft)
                    ? rootProject.file('src/compat_legacy_4arg/java')
                    : rootProject.file('src/compat_legacy_pose/java')
                compatJavaDirs += rootProject.file('src/compat_legacy_keymap/java')
                compatJavaDirs += mc.minecraft.startsWith('1.21')
                    ? rootProject.file('src/compat_hud_delta/java')
                    : rootProject.file('src/compat_hud_legacy/java')
            }

            compatJavaDirs += project.file('src/main/java')
            java.setSrcDirs(compatJavaDirs)
            resources.setSrcDirs([
                project.file('src/main/resources'),
                rootProject.file('src/main/resources')
            ])
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${mc.minecraft}"
        if (!nonObfuscated) {
            mappings loom.officialMojangMappings()
            modImplementation "net.fabricmc:fabric-loader:${mc.loader ?: rootProject.fabric_loader_version}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${mc.fabricApi}"
        } else {
            implementation "net.fabricmc:fabric-loader:${mc.loader ?: rootProject.fabric_loader_version}"
            implementation "net.fabricmc.fabric-api:fabric-api:${mc.fabricApi}"
        }
        if (mc.minecraft == '1.21.11') {
            testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }
    }

    if (mc.minecraft == '1.21.11') {
        tasks.named('test', Test) {
            useJUnitPlatform()
        }
    }

    processResources {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        inputs.property 'version', modBuildVersion
        inputs.property 'minecraft_version', mc.minecraft
        inputs.property 'fabric_loader_version', mc.loader ?: rootProject.fabric_loader_version
        inputs.property 'fabric_api_version', mc.fabricApi
        inputs.property 'java_version', mc.java ?: 17

        filesMatching('fabric.mod.json') {
            expand(
                version: modBuildVersion,
                minecraft_version: mc.minecraft,
                fabric_loader_version: mc.loader ?: rootProject.fabric_loader_version,
                fabric_api_version: mc.fabricApi,
                java_version: mc.java ?: 17
            )
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = mc.java ?: 17
    }

    tasks.withType(Jar).configureEach {
        reproducibleFileOrder = true
        preserveFileTimestamps = false
    }

    java {
        sourceCompatibility = JavaVersion.toVersion(mc.java ?: 17)
        targetCompatibility = JavaVersion.toVersion(mc.java ?: 17)
    }

    publishing {
        publications {
            create('mavenJava', MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        repositories {
        }
    }

    if (project.hasProperty('taskmanagerLiveTest')) {
        def hasClientGameTest = [
        'mc1_21_4', 'mc1_21_5', 'mc1_21_6', 'mc1_21_7', 'mc1_21_8',
        'mc1_21_9', 'mc1_21_10', 'mc1_21_11',
        'mc26_1', 'mc26_1_1', 'mc26_1_2', 'mc26_2', 'mc26_3'
        ].contains(project.name)
        fabricApi {
            configureTests {
                createSourceSet = true
                modId = 'taskmanager-private-client-test'
                enableGameTests = false
                enableClientGameTests = hasClientGameTest
            }
        }
        sourceSets.gametest.java.setSrcDirs(hasClientGameTest ? [
                rootProject.file('src/clientGameTest/java'),
                rootProject.file(nonObfuscated && ['26.2', '26.3'].contains(mc.minecraft)
                    ? 'src/clientGameTest_26_3/java'
                    : 'src/clientGameTest_1_21_11/java')
            ] : [rootProject.file('src/clientLegacyTest/java')])
        sourceSets.gametest.resources.setSrcDirs([
            rootProject.file(hasClientGameTest
                ? 'src/clientGameTest/resources'
                : 'src/clientLegacyTest/resources')
        ])
        tasks.named('processGametestResources', ProcessResources) {
            inputs.property 'test_minecraft_version', mc.minecraft
            inputs.property 'test_fabric_loader_version', mc.loader ?: rootProject.fabric_loader_version
            filesMatching('fabric.mod.json') {
                expand(
                    test_minecraft_version: mc.minecraft,
                    test_fabric_loader_version: mc.loader ?: rootProject.fabric_loader_version
                )
            }
        }
        dependencies {
            productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${mc.fabricApi}"
        }
        def clientTestJar = tasks.register('privateClientTestJar', Jar) {
            from(sourceSets.gametest.output)
            archiveBaseName = 'taskmanager-private-client-test'
            archiveVersion = '1.0.0'
            archiveClassifier = 'dev'
            destinationDirectory = layout.buildDirectory.dir('private')
        }
        def clientTestRuntimeJar = clientTestJar
        if (!nonObfuscated) {
            clientTestRuntimeJar = tasks.register('remapPrivateClientTestJar', net.fabricmc.loom.task.RemapJarTask) {
                dependsOn clientTestJar
                inputFile.set(clientTestJar.flatMap { it.archiveFile })
                archiveBaseName = 'taskmanager-private-client-test'
                archiveVersion = '1.0.0'
                archiveClassifier = ''
                destinationDirectory = layout.buildDirectory.dir('private')
            }
        }
        tasks.register('runProductionClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
            if (hasClientGameTest) {
                jvmArgs.add('-Dfabric.client.gametest')
            } else {
                jvmArgs.add("-Dtaskmanager.test.address=${project.findProperty('taskmanagerTestAddress') ?: '127.0.0.1:27260'}")
                programArgs.addAll(['--username', project.findProperty('taskmanagerTestUsername') ?: 'TaskProbe'])
                programArgs.addAll(['--width', '1600', '--height', '900'])
            }
            jvmArgs.add("-Dtaskmanager.test.sha512=${project.findProperty('taskmanagerTestSha') ?: ''}")
            jvmArgs.add("-Dtaskmanager.test.minecraft=${mc.minecraft}")
            if (mc.minecraft == '26.3') {
                programArgs.addAll(['--graphicsBackend', 'vulkan'])
            }
            runDir = file("build/live-client-${mc.minecraft}-${project.findProperty('taskmanagerTestRunId') ?: 'gallery'}")
            mods.from(clientTestRuntimeJar)
        }
    }
}

tasks.register('printVersionModules') {
    group = 'help'
    description = 'Prints version modules as module|minecraftVersion for external tooling.'

    doLast {
        rootProject.versionMatrix.each { moduleName, moduleConfig ->
            println("${moduleName}|${moduleConfig.minecraft}")
        }
    }
}
